<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal Sign In — Valgus Designs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="portal-body">

<main class="portal portal--auth">

  <header class="portal__header">
    <p class="portal__brand">Valgus Designs</p>
    <h1 class="portal__greeting">Client Portal</h1>
    <p class="portal__intro">Sign in to view your ongoing projects, invoices, and updates.</p>
  </header>

  {% if error %}
  <div class="auth-error">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/accounts/login/" class="auth-form">
    {% csrf_token %}

    <div class="auth-form__field">
      <label for="username">Username or Email</label>
      <input type="text" id="username" name="username" required autocomplete="username" />
    </div>

    <div class="auth-form__field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />
    </div>

    <button type="submit" class="auth-form__submit">Sign In</button>
  </form>

</main>

</body>
</html>
