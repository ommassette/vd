<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal Sign In — Valgus Designs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="portal-body">

  <main class="portal" style="max-width: 480px; margin: 80px auto;">

    <header class="portal__header">
      <p class="portal__brand">Valgus Designs</p>
      <h1 class="portal__greeting">Client Portal</h1>
      <p class="portal__intro">Sign in to view your ongoing projects, invoices, and updates.</p>
    </header>

    {% if error %}
    <div style="background: rgba(220, 38, 38, 0.1); border: 1px solid #dc2626; color: #dc2626; padding: 12px 16px; border-radius: 4px; margin-bottom: 24px; font-size: 0.9rem;">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/accounts/login/" style="display: flex; flex-direction: column; gap: 20px;">
      {% csrf_token %}
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="username" style="font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Username or Email</label>
        <input type="text" id="username" name="username" required autocomplete="username" style="width: 100%; padding: 12px 16px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-family: inherit; font-size: 1rem; border-radius: 4px;" />
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="password" style="font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" style="width: 100%; padding: 12px 16px; background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-family: inherit; font-size: 1rem; border-radius: 4px;" />
      </div>

      <button type="submit" style="margin-top: 12px; padding: 14px 24px; background: #fff; color: #000; border: none; font-family: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; border-radius: 4px;">Sign In</button>
    </form>

  </main>

</body>
</html>
