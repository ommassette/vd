<!-- app/templates/contact.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}Contact — Valgus Designs{% endblock %}

{% block content %}
  <main class="hero contact-hero">
    <section class="contact-section">
      <form class="contact-form" method="post" novalidate>
        {% csrf_token %}
        <div class="contact-form__field">
          <label for="contact-subject">Subject</label>
          <input type="text" id="contact-subject" name="subject" required />
        </div>
        <div class="contact-form__field">
          <label for="contact-email">Email</label>
          <input type="email" id="contact-email" name="email" required />
        </div>
        <div class="contact-form__field">
          <label for="contact-phone">Phone Number</label>
          <input type="tel" id="contact-phone" name="phone" required />
        </div>
        <div class="contact-form__field">
          <label for="contact-message">Message</label>
          <textarea id="contact-message" name="message" rows="6" required></textarea>
        </div>
        <button type="submit" class="contact-form__submit">Send Message</button>
      </form>

      <p class="contact-text">{{ content.contact_text }}</p>
    </section>
  </main>

  <section class="feedback-section">
    <h2 class="feedback-section__title">{{ content.feedback_title }}</h2>
    <p class="feedback-section__text">{{ content.feedback_text }}</p>

    <form class="feedback-form" method="post" novalidate>
      {% csrf_token %}
      <div class="feedback-form__field">
        <label for="feedback-position">Position</label>
        <input type="text" id="feedback-position" name="position" required />
      </div>
      <div class="feedback-form__field">
        <label for="feedback-email">Email</label>
        <input type="email" id="feedback-email" name="email" />
      </div>
      <div class="feedback-form__field">
        <label for="feedback-message">Feedback</label>
        <textarea id="feedback-message" name="feedback" rows="6" required></textarea>
      </div>
      <button type="submit" class="feedback-form__submit">Submit Feedback</button>
    </form>
  </section>
{% endblock %}
